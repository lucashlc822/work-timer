[package]
name = "starkeep"
version = "0.2.1"
description = "A focus timer where every session you finish becomes a star."
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 splits the entry point out so the same code can be reused across
# desktop targets. `main.rs` is a thin shim over `run()` in `lib.rs`.
name = "starkeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A focus timer has no business being large. These cost compile time and buy
# roughly half the binary size back.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
