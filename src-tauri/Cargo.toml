[package]
name = "starkeep"
version = "0.9.0"
description = "A focus timer where every session you finish becomes a star."
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 splits the entry point out so the same code can be reused across
# desktop targets. `main.rs` is a thin shim over `run()` in `lib.rs`.
name = "starkeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Without the default `zip` feature: it only unpacks `.zip` (Windows) and
# compressed-AppImage (Linux) updates. Our Windows update is a plain NSIS
# `.exe` (extract_exe), and macOS unpacks its `.app.tar.gz` with tar/flate2,
# which the plugin always depends on there. Leaving it on only brought `zip`
# advisories (RUSTSEC-2026-0367/0368/0369/0429). See CLAUDE.md, Decisions.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A focus timer has no business being large. These cost compile time and buy
# roughly half the binary size back.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
