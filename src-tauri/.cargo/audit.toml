# cargo-audit configuration (`cargo audit`, run from src-tauri/).
#
# Each ignore names why the advisory can't reach Starkeep, and when to drop it.
# Re-check on every Tauri update, and never add an entry without the reason
# beside it.
#
# Empty since 2026-11-12: the four `zip` advisories (RUSTSEC-2026-0367, 0368,
# 0369, 0429) went with the crate itself, when the updater was built without
# its `zip` feature (src-tauri/Cargo.toml; CLAUDE.md, Decisions).

[advisories]
ignore = []
