# Lint, typecheck, test, and build on every push and pull request.
#
# The template's default advice is to skip the build step, on the grounds that
# the host usually builds on deploy. It is kept here deliberately: `vite build`
# is what generates the service worker and PWA manifest, so a change that
# breaks the offline shell would otherwise pass CI and only surface on a real
# device — which for an installed PWA means a broken app with no address bar
# to reload from.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # Runs `tsc -b` before `vite build`, so this covers typechecking too.
      - run: npm run build

      - run: npm test

      # The generated app icons are committed, so regenerating them must be a
      # no-op. A failure here means the generator or the palette changed
      # without `npm run icons` being re-run.
      - name: Generated icons are up to date
        run: |
          npm run icons
          git diff --exit-code --stat public/
