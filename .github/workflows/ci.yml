# Lint, typecheck, test, and build on every push and pull request.
#
# Split into two jobs because they have very different costs. The web job is
# fast and runs on Linux; the desktop job has to compile the Tauri dependency
# tree, so it is cached aggressively and runs on Windows — the only platform
# actually targeted, and cheaper than installing the GTK/WebKit stack a Linux
# runner would need.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # Runs `tsc -b` before `vite build`, so this covers typechecking too.
      # The web build also generates the service worker, so a break in the
      # offline shell fails here rather than on a user's machine.
      - run: npm run build

      - run: npm test

      # The generated app icons are committed, so regenerating them must be a
      # no-op. A failure means the generator or the palette changed without
      # `npm run icons` being re-run.
      - name: Generated icons are up to date
        run: |
          npm run icons
          git diff --exit-code --stat public/ src-tauri/icons/

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on Cargo.lock so the dependency tree is only recompiled when it
      # actually changes. Without this the job takes ~15 minutes every run.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `cargo check` rather than a full build: it catches every type and
      # borrow error without paying for codegen and linking, which is the
      # expensive half. Producing an actual installer is a release concern.
      - name: Rust compiles
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
