# Lint, typecheck, test, and build on every push and pull request.
#
# Split into two jobs because they have very different costs. The web job is
# fast and runs on Linux; the desktop job has to compile the Tauri dependency
# tree, so it is cached aggressively and runs on Windows — the only platform
# actually targeted, and cheaper than installing the GTK/WebKit stack a Linux
# runner would need.
#
# A change where every file is Markdown (the session log, the docs) can't
# affect anything these jobs check: Prettier ignores `*.md`, and nothing else
# reads one. The `changes` job decides that first, and the four jobs below are
# skipped when it says so. They show as "skipped" rather than being absent, so
# a docs-only PR is still visibly checked. When in doubt (no file list, a
# failed diff, a new branch) everything runs.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is anything other than Markdown changed?
        id: decide
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          code=true
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No earlier commit to compare with: running everything."
          elif ! files=$(git diff --name-only --no-renames "$BASE" "$HEAD"); then
            echo "The diff failed: running everything."
          else
            echo "Changed files:"
            echo "$files" | sed 's/^/  /'
            n=$(echo "$files" | grep -c .) || n=0
            other=$(echo "$files" | grep -v '^$' | grep -vc '\.md$') || other=0
            if [ "$n" -gt 0 ] && [ "$other" -eq 0 ]; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "Docs only: test jobs skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Code changed: running all jobs." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # Runs `tsc -b` before `vite build`, so this covers typechecking too.
      # The web build also generates the service worker, so a break in the
      # offline shell fails here rather than on a user's machine.
      - run: npm run build

      - run: npm test

      # How big the built app is, against e2e/perf-baseline.json. Report only:
      # it prints a table into the job summary and never fails the job.
      - name: Bundle size (report only)
        run: npm run perf:size

      # The generated app icons are committed, so regenerating them must be a
      # no-op. A failure means the generator or the palette changed without
      # `npm run icons` being re-run.
      - name: Generated icons are up to date
        run: |
          npm run icons
          git diff --exit-code --stat public/ src-tauri/icons/

  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on Cargo.lock so the dependency tree is only recompiled when it
      # actually changes. Without this the job takes ~15 minutes every run.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `cargo check` rather than a full build: it catches every type and
      # borrow error without paying for codegen and linking, which is the
      # expensive half. Producing an actual installer is a release concern.
      - name: Rust compiles
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # The server's rules — row-level security between users, invite-only
  # sign-up, insert-only sessions, last-write-wins tags — are what keep one
  # person's data away from another's, so they are tested against a real
  # Postgres on every change. GitHub's Linux runners have Docker, which the
  # local Supabase stack needs.
  db:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        run: npx supabase start

      - name: Database tests (pgTAP)
        run: npx supabase test db

  # The app in a real browser against a real (local) server: sign-up with the
  # emailed code, sign-in, password reset, sign-out isolation on a shared
  # browser, and live updates never crossing accounts. The tests only ever
  # talk to this runner's own Supabase stack (e2e/support/localStack.ts);
  # nothing here has, or needs, a secret. The services the tests don't use are
  # left out to start faster.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e:web

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
