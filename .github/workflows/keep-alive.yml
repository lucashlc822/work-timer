# Keeps the hosted Supabase project from pausing.
#
# The free tier pauses a project after about 7 days without activity, and a
# paused project stops every friend's sync until it is restored by hand. This
# asks the database one question every ~3 days (scripts/keep-alive.mjs reads
# the publicly readable `app_config` table with the publishable key, so no
# secret is involved). If the answer is wrong the run fails and GitHub emails
# the repository owner: that is the first sign of a pause or a changed key.
#
# GitHub turns scheduled workflows off in a public repository after 60 days
# with no repository activity (it emails first). Re-enable it from the Actions
# tab, or push any commit.
name: Keep server awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node scripts/keep-alive.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
