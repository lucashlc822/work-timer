<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="%NIGHT_900%" />
    <style>
      html,
      body {
        background: %NIGHT_900%;
      }
    </style>
    <!-- %APP_NAME% and %APP_DESCRIPTION% are substituted at build time from
         brand.mjs by the inject-brand plugin in vite.config.ts, so the product
         name is written down in exactly one place. -->
    <meta name="description" content="%APP_DESCRIPTION%" />
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
